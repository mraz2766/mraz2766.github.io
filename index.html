<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />

  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)" />
  <title>mraz — 收藏图鉴 · A Catalog</title>
  <meta name="description"
    content="mraz 收藏图鉴：桌上的玩具，家里的猫狗，和偶尔落在它们身上的光。A catalog of toys, pets and light." />

  <!-- Apply the saved light/dark choice before first paint (no flash). -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('mraz-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (error) { /* storage unavailable: follow the system */ }
    }());
  </script>

  <!-- Start fetching the gallery manifest in parallel with the JS bundle. -->
  <link rel="preload" href="/photos.json" as="fetch" crossorigin="anonymous" />

  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_CN" />
